name: Auto-merge approved content

on:
  pull_request_target:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Run when a PR is labeled 'approved' OR when main advances (to chain-merge)
    if: >
      (github.event_name == 'push') ||
      (github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Find PR to merge
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # On push to main: pick the oldest approved PR to continue the chain
            PR=$(gh pr list --label approved --state open \
              --limit 1 --json number --jq '.[0].number' \
              -R "$GITHUB_REPOSITORY")
            if [ -z "$PR" ] || [ "$PR" = "null" ]; then
              echo "No approved PRs remaining"
              echo "pr=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # On label event: use the PR that was just approved
            PR="${{ github.event.pull_request.number }}"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Processing PR #$PR"

      - name: Check PR only touches catalog/
        if: steps.find.outputs.pr
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.find.outputs.pr }}
        run: |
          files=$(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")
          non_catalog=$(echo "$files" | grep -v '^catalog/' || true)
          if [ -n "$non_catalog" ]; then
            echo "PR #$PR_NUMBER touches non-catalog files — skipping auto-merge:"
            echo "$non_catalog"
            echo "catalog_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "catalog_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge PR
        if: steps.find.outputs.pr && steps.check.outputs.catalog_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.find.outputs.pr }}
        run: |
          # Merge directly instead of --auto to avoid cancellation when
          # the base branch advances. The push trigger re-fires this
          # workflow for the next approved PR, creating a merge chain.
          if ! gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"; then
            echo "Direct merge failed — falling back to auto-merge"
            gh pr merge "$PR_NUMBER" --squash --auto --repo "$GITHUB_REPOSITORY" || true
          fi
          echo "Processed PR #$PR_NUMBER"
