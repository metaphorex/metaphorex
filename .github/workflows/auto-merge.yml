name: Auto-merge approved content

on:
  pull_request_target:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Run when a PR is labeled 'approved' OR when main advances (chain-merge)
    if: >
      (github.event_name == 'push') ||
      (github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Merge approved PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Merge up to 5 approved catalog-only PRs per run.
          # Each successful merge pushes to main, which triggers the next
          # run via the push trigger — creating a self-draining chain.
          MERGED=0
          MAX=5

          for PR_NUMBER in $(gh pr list --label approved --state open \
            --limit 20 --json number --jq '.[].number' \
            -R "$GITHUB_REPOSITORY"); do

            [ "$MERGED" -ge "$MAX" ] && break

            # Skip PRs that touch non-catalog files
            files=$(gh pr diff "$PR_NUMBER" --name-only \
              --repo "$GITHUB_REPOSITORY" 2>/dev/null) || continue
            non_catalog=$(echo "$files" | grep -v '^catalog/' || true)
            if [ -n "$non_catalog" ]; then
              echo "PR #$PR_NUMBER touches non-catalog files — skip"
              continue
            fi

            # Squash merge (strict=false means no rebase needed)
            if gh pr merge "$PR_NUMBER" --squash \
              --repo "$GITHUB_REPOSITORY" 2>&1; then
              echo "Merged PR #$PR_NUMBER"
              MERGED=$((MERGED + 1))
              sleep 2
            else
              echo "PR #$PR_NUMBER failed to merge — skip"
            fi
          done

          echo "Merged $MERGED PRs this run"
